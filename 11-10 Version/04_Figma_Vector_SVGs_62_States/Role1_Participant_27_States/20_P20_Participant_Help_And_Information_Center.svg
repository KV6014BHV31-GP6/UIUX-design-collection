    <text x="320" y="164" font-family="Inter, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">❓  Help &amp; Information · Community Support Center</text>
    <text x="320" y="186" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#DFB982">Frequently asked questions and assistance for participants &amp; families</text>

    <rect x="320" y="232" width="1000" height="106" rx="14" fill="#FAF8F4" stroke="#E2DEC9"/>
    <text x="344" y="262" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#153B30">1. Do I need an account to register for an event?</text>
    <text x="344" y="288" font-family="Inter, sans-serif" font-size="13" fill="#4B5563">No! You can browse events and submit the 6-field registration form directly as a Guest without creating an account.</text>
    <text x="344" y="312" font-family="Inter, sans-serif" font-size="13" fill="#1F6F50" font-weight="600">→ Click &quot;Events&quot; in the left menu to choose an event and register right away.</text>

    <rect x="320" y="356" width="1000" height="106" rx="14" fill="#FAF8F4" stroke="#E2DEC9"/>
    <text x="344" y="386" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#153B30">2. How do I check my registration status if I applied as a Guest?</text>
    <text x="344" y="412" font-family="Inter, sans-serif" font-size="13" fill="#4B5563">Click &quot;Check Registration&quot; in the left menu and enter your Reference Number (e.g. #RP-2027-0315) or Mobile Phone + National ID.</text>
    <text x="344" y="436" font-family="Inter, sans-serif" font-size="13" fill="#1F6F50" font-weight="600">→ Or create a Participant Account anytime to automatically link all your bookings.</text>

    <rect x="320" y="480" width="1000" height="106" rx="14" fill="#FAF8F4" stroke="#E2DEC9"/>
    <text x="344" y="510" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#153B30">3. What happens if an event is full?</text>
    <text x="344" y="536" font-family="Inter, sans-serif" font-size="13" fill="#4B5563">You can join the Waiting List. If another participant cancels their spot, we will notify you by SMS automatically.</text>
    <text x="344" y="560" font-family="Inter, sans-serif" font-size="13" fill="#1F6F50" font-weight="600">→ Community Leaders also hold reserved offline places for local residents.</text>

    <rect x="320" y="610" width="1000" height="96" rx="14" fill="#EDF3F0" stroke="#88B69E"/>
    <text x="344" y="642" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#153B30">📞  Need Assistance? Contact ROSE · PULSE Community Support</text>
    <text x="344" y="668" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1F6F50">Hotline: +60 3-7950 2888 (Mon–Sat, 9:00 AM – 5:00 PM)   ·   WhatsApp Helpdesk: +60 12-888 9900</text>

